
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluecarbon-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bluecarbon-backend
  template:
    metadata:
      labels:
        app: bluecarbon-backend
    spec:
      containers:
        - name: backend
          image: kanvii03/bluecarbon-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
